[project]
name = "mini-rag"
version = "0.1.0"
description = "A small retrieval-augmented generation API built with FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.6.0",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
